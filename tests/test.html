<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Bestell-App Test</title></head>
<body>
<pre id="log">läuft…</pre>
<iframe id="app" style="width:412px;height:900px"></iframe>
<script>
// Spielt die wichtigsten Abläufe der App durch und schickt das Ergebnis an server.ps1.
const log = [];
let fails = 0;
const check = (ok, msg) => {
  log.push((ok ? 'OK   ' : 'FEHL ') + msg);
  if (!ok) fails++;
  document.getElementById('log').textContent = 'läuft…\n' + log.join('\n');
};
const step = msg => { log.push('…    ' + msg); document.getElementById('log').textContent = 'läuft…\n' + log.join('\n'); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = document.getElementById('app');

// Die App startet bei den Aufgaben; für die Bestell-Prüfungen wird danach zur Bestellung gewechselt.
async function load({ mode = 'order', heute = '' } = {}) {
  await new Promise(res => {
    frame.onload = () => setTimeout(res, 400);
    frame.src = '../index.html?t=' + Date.now() + (heute ? '&heute=' + heute : '');
  });
  if (mode === 'order') click('[data-mode-tab=order]');
}
const w = () => frame.contentWindow;
const d = () => frame.contentDocument;
const q = s => d().querySelector(s);
const qa = s => [...d().querySelectorAll(s)];
const click = s => { const el = typeof s === 'string' ? q(s) : s; el.click(); };
const stored = () => JSON.parse(w().localStorage.getItem('bestellapp'));
const route = () => stored().route;
const names = () => route().map(e => (e.kind === 'section' ? '#' : '') + e.name).join('|');
const byNameId = n => route().find(e => e.name === n).id;
const orderList = () => qa('.orow').map(b => b.querySelector('.qty').textContent.replace('×', 'x') + ' ' + b.querySelector('.name').firstChild.textContent.trim()).join('|');
const type = (sel, value, ev = 'input') => { q(sel).value = value; q(sel).dispatchEvent(new (w().Event)(ev, { bubbles: true })); };

async function fill(name, { sup, soll, photo = false } = {}) {
  q('#pName').value = name;
  if (sup) for (const cb of qa('#pSup input')) cb.checked = sup.includes(cb.value);
  if (soll !== undefined) q('#pSoll').value = soll;
  if (photo) {
    const c = d().createElement('canvas'); c.width = 1200; c.height = 900;
    const g = c.getContext('2d'); g.fillStyle = '#c00'; g.fillRect(0, 0, 1200, 900);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg'));
    const dt = new (w().DataTransfer)(); dt.items.add(new (w().File)([blob], 'foto.jpg', { type: 'image/jpeg' }));
    q('#camInput').files = dt.files;
    q('#camInput').dispatchEvent(new (w().Event)('change'));
    await wait(400);
  }
}
async function saveDlg(next = false) { click(`#productDlg [data-pact="${next ? 'save-next' : 'save'}"]`); await wait(300); }
async function answer(yes) { await wait(100); click(yes ? '#askYes' : '#askNo'); await wait(250); }
async function reset() {
  w().localStorage.clear();
  await new Promise(r => { const req = w().indexedDB.deleteDatabase('bestellapp-fotos'); req.onsuccess = req.onerror = req.onblocked = r; });
}

(async () => {
  try {
    step('lade App');
    await load();
    await reset();

    // ---------- Umbau alter Daten (zwei getrennte Listen) ----------
    w().localStorage.setItem('bestellapp', JSON.stringify({
      suppliers: {
        lekkerland: { products: [{ id: 'a', name: 'Apfelschorle', count: 2, photo: false }, { id: 'b', name: 'Brötchen', count: 0, photo: false }], order: null },
        tabacon: { products: [{ id: 'b2', name: 'brötchen ', count: 1, photo: true }, { id: 'c', name: 'Camel', count: 0, photo: false }],
          order: { created: 1, items: [{ id: 'c', name: 'Camel', count: 3, done: true }] } },
      },
      ui: { supplier: 'tabacon', view: 'count', scroll: {} },
    }));
    await load();
    let s = stored();
    check(names() === 'Apfelschorle|Brötchen|Camel', 'Alte Listen werden zu einem Laufweg');
    const br = s.route[1];
    check(br.sup.lekkerland && br.sup.tabacon && br.count.tabacon === 1 && br.id === 'b2' && br.photo, 'Gleichnamige Produkte zusammengelegt (mit Foto)');
    check(s.route[0].count.lekkerland === 2 && !s.route[0].sup.tabacon, 'Zähler und Lieferant bleiben erhalten');
    check(s.route[2].count.tabacon === 3 && s.orders.tabacon.done.c === 3, 'Alte Bestellliste wird zu Zählern mit Haken');
    check(!!w().localStorage.getItem('bestellapp-v1'), 'Alter Stand wird zusätzlich aufgehoben');

    step('neu anfangen');
    await reset();
    await load();

    // ---------- Laufweg mit Abschnitten anlegen ----------
    check(q('.empty [data-act=add]') && q('.empty [data-act=add-section]'), 'Leere App bietet Produkt und Abschnitt an');
    click('[data-act=add-section]');
    check(q('#pProductFields').hidden && q('#pPhotoRow').hidden && !q('#pEmojiField').hidden, 'Abschnitt-Fenster mit Symbol, ohne Foto und Lieferanten');
    click('#pEmoji [data-emoji="🥐"]');
    await fill('Backwaren'); await saveDlg();
    check(route()[0].emoji === '🥐' && q(`#sec-${route()[0].id}`).textContent.includes('🥐'), 'Abschnitt-Symbol gespeichert und angezeigt');
    click('[data-act=add]');
    check(q('#pSup input[value=lekkerland]').checked && !q('#pSup input[value=tabacon]').checked, 'Neues Produkt: aktueller Lieferant vorausgewählt');
    await fill('Brötchen', { sup: ['lekkerland', 'tabacon'], soll: 6, photo: true }); await saveDlg(true);
    check(q('#productDlg').open && q('#pName').value === '' && q('#pPos').value === '3', '"Speichern & nächstes" leert das Fenster, Position 3');
    check(q('#pSup input[value=tabacon]').checked && q('#pSup input[value=lekkerland]').checked, 'Haken vom letzten Produkt werden übernommen');
    check(q('#pSec').value === byNameId('Backwaren'), 'Abschnitt wird vorgeschlagen');
    await fill('Croissant'); await saveDlg(true);
    await fill('Laugenbrezel', { sup: ['lekkerland'] }); await saveDlg();
    click('[data-act=add-section]'); await fill('Tabak'); await saveDlg();
    click('[data-act=add]');
    await fill('Marlboro Rot', { sup: [] }); await saveDlg();
    check(q('#productDlg').open && !q('#pSupHint').hidden, 'Ohne Lieferant wird nicht gespeichert');
    await fill('Marlboro Rot', { sup: ['tabacon'], soll: 10 }); await saveDlg();
    check(names() === '#Backwaren|Brötchen|Croissant|Laugenbrezel|#Tabak|Marlboro Rot', 'Laufweg in Anlege-Reihenfolge');
    s = stored();
    check(s.route[1].soll === 6 && s.route[2].soll === null && s.route[1].photo, 'Soll-Bestand und Foto gespeichert');

    // ---------- Abschnitt im Fenster wechseln ----------
    click(`[data-id="${byNameId('Croissant')}"] [data-act=open]`);
    check(q('#pSec').value === byNameId('Backwaren'), 'Fenster zeigt den Abschnitt des Produkts');
    type('#pSec', byNameId('Tabak'), 'change');
    check(q('#pPos').value === '6', 'Abschnitt wählen setzt die Position ans Ende des Abschnitts');
    await saveDlg();
    check(names() === '#Backwaren|Brötchen|Laugenbrezel|#Tabak|Marlboro Rot|Croissant', 'Produkt in anderen Abschnitt verschoben');
    click(`[data-id="${byNameId('Croissant')}"] [data-act=open]`);
    type('#pPos', '3');
    check(q('#pSec').value === byNameId('Backwaren'), 'Position ändern zeigt den passenden Abschnitt');
    await saveDlg();
    check(names() === '#Backwaren|Brötchen|Croissant|Laugenbrezel|#Tabak|Marlboro Rot', 'Position per Nummer setzen');
    click(`[data-id="${byNameId('Tabak')}"] [data-act=up]`);
    check(names() === '#Backwaren|Brötchen|Croissant|#Tabak|Laugenbrezel|Marlboro Rot', 'Abschnitt mit ▲ verschieben');
    click(`[data-id="${byNameId('Tabak')}"] [data-act=down]`);

    // ---------- Durchgehen je Lieferant ----------
    // Fenster darf auf schmalen Handys nicht seitlich scrollen
    frame.style.width = '320px'; await wait(200);
    click(`[data-id="${byNameId('Brötchen')}"] [data-act=open]`); await wait(300);
    const dlg = q('#productDlg');
    check(dlg.scrollWidth <= dlg.clientWidth, `Produktfenster bei 320 px ohne seitliches Scrollen (${dlg.scrollWidth} ≤ ${dlg.clientWidth})`);
    click('#productDlg [data-pact=cancel]');
    frame.style.width = '412px'; await wait(200);

    click('[data-act=toggle-edit]');
    check(qa('#list .sec').length === 1 && q('#list .sec').textContent === '🥐Backwaren', 'Lekkerland: nur Abschnitte mit Lekkerland-Produkten');
    check(qa('#list .row').length === 3 && !q('#secChips').hidden && qa('#secChips button').length === 1, 'Lekkerland: 3 Produkte, 1 Sprungknopf');
    check(q(`[data-id="${byNameId('Brötchen')}"] .soll`).textContent === 'Soll 6', 'Soll-Bestand steht beim Produkt');
    click('[data-sup-tab=tabacon]');
    check(qa('#list .sec').length === 2 && qa('#list .row').length === 3, 'Tabacon: 2 Abschnitte, 3 Produkte');

    // ---------- Suche ----------
    type('#search', 'marl');
    check(qa('#list .row').length === 1 && qa('#list .sec').length === 0 && q('#secChips').hidden, 'Suche zeigt nur Treffer');
    type('#search', 'xyz');
    check(q('#list .none'), 'Suche ohne Treffer');
    click('[data-act=clear-search]');
    check(qa('#list .row').length === 3 && q('#search').value === '', 'Suche leeren');

    // ---------- Zählen getrennt je Lieferant ----------
    const marl = byNameId('Marlboro Rot'), broe = byNameId('Brötchen');
    click(`[data-id="${marl}"] [data-act=plus]`); click(`[data-id="${marl}"] [data-act=plus]`);
    click(`[data-id="${broe}"] [data-act=plus]`);
    click('[data-sup-tab=lekkerland]');
    for (let i = 0; i < 3; i++) click(`[data-id="${broe}"] [data-act=plus]`);
    s = stored();
    let b = s.route.find(e => e.id === broe);
    check(b.count.lekkerland === 3 && b.count.tabacon === 1, 'Zähler je Lieferant getrennt');
    await load();
    check(q(`[data-id="${broe}"] .count`).textContent === '3' && q(`[data-id="${broe}"] img`), 'Zähler und Foto bleiben nach Neustart');

    // ---------- Zur Bestellliste ----------
    click('[data-sup-tab=tabacon]');
    click('[data-act=to-order]'); await wait(100);
    check(!q('#askDlg').open && stored().ui.view === 'order', '"Zur Bestellliste" ohne Sicherheitsabfrage');
    check(orderList() === '1x Brötchen|2x Marlboro Rot', 'Bestellliste alphabetisch aus den Zählern');
    b = stored().route.find(e => e.id === broe);
    check(b.count.tabacon === 1 && b.count.lekkerland === 3, 'Zähler bleiben stehen');
    click('[data-view-tab=count]');
    click(`[data-id="${byNameId('Croissant')}"] [data-act=plus]`);
    click('[data-view-tab=order]');
    check(orderList() === '1x Brötchen|1x Croissant|2x Marlboro Rot', 'Nachträglich hinzugefügtes Produkt steht in der Bestellliste');
    check(q('#badgeOrder').textContent === '3', 'Abzeichen zählt offene Produkte');

    // ---------- Teilen ----------
    let shared = null;
    w().navigator.share = async data => { shared = data; };
    click('[data-act=share]'); await wait(100);
    check(shared && shared.text.includes('Bestellung Tabacon') && shared.text.includes('2× Marlboro Rot'), 'Liste teilen');

    // ---------- Abhaken ----------
    click(`.orow[data-id="${broe}"]`);
    await load();
    check(q(`.orow[data-id="${broe}"]`).classList.contains('done') && q('#doneText').textContent.startsWith('1 von 3'), 'Haken bleibt nach Neustart');
    click('[data-view-tab=count]');
    check(q(`[data-id="${broe}"] .entered`), 'Durchgehen zeigt "✓ eingegeben"');
    click(`[data-id="${broe}"] [data-act=plus]`);
    check(!q(`[data-id="${broe}"] .entered`), 'Menge geändert: "eingegeben" verschwindet');
    click('[data-view-tab=order]');
    const changed = q(`.orow[data-id="${broe}"]`);
    check(!changed.classList.contains('done') && changed.querySelector('.changed').textContent.includes('vorher 1×'), 'Bestellliste zeigt "geändert, vorher 1×"');
    for (const btn of qa('.orow')) btn.click();
    check(q('canvas.confetti') && !q('#allDone').hidden, 'Konfetti beim letzten Haken');
    check(d().querySelector('meta[name=theme-color]').content === '#1c7ed6', 'Statusleiste in Tabacon-Blau');

    // ---------- Bestellliste löschen ----------
    click('[data-act=clear-order]');
    check(q('#askTitle').textContent === 'Bestellliste löschen?', 'Bestellliste löschen fragt nach');
    await answer(false);
    check(orderList().startsWith('2x Brötchen'), 'Abbrechen lässt alles stehen');
    click('[data-act=clear-order]');
    await answer(true);
    s = stored();
    check(s.route.filter(e => e.kind === 'product').every(p => p.count.tabacon === 0) && Object.keys(s.orders.tabacon.done).length === 0,
      'Bestellliste löschen setzt Tabacon-Zähler auf 0');
    check(s.route.find(e => e.id === broe).count.lekkerland === 3 && s.ui.view === 'count', 'Lekkerland bleibt unberührt, zurück zu Durchgehen');

    // ---------- Sicherungs-Erinnerung ----------
    check(q('.notice'), 'Erinnerung, wenn noch nie gesichert');
    click('.notice [data-act=backup]');
    check(q('#menuDlg').open, 'Erinnerung öffnet die Sicherung');
    click('#exportBtn'); await wait(500);
    click('#menuDlg [value=close]'); await wait(100);
    check(stored().ui.lastBackup && !q('.notice'), 'Nach dem Sichern verschwindet die Erinnerung');

    // ---------- Löschen ----------
    // Wiederherstellungspunkt mit dem jetzigen Stand, damit das Zurückholen unten etwas zu tun hat
    await w().writeTx('punkte', s => s.clear());
    await load(); await wait(300);
    click('[data-act=toggle-edit]');
    click(`[data-id="${byNameId('Tabak')}"] [data-act=delete]`);
    check(q('#askTitle').textContent === 'Abschnitt löschen?', 'Abschnitt löschen fragt nach');
    await answer(true);
    check(names() === '#Backwaren|Brötchen|Croissant|Laugenbrezel|Marlboro Rot', 'Abschnitt weg, Produkte bleiben');
    click(`[data-id="${broe}"] [data-act=delete]`);
    check(q('#askText').textContent.includes('Lekkerland und Tabacon'), 'Löschen nennt beide Lieferanten');
    await answer(false);
    check(names().includes('Brötchen'), 'Abbrechen löscht nichts');
    click(`[data-id="${broe}"] [data-act=open]`);
    click('#productDlg [data-pact=delete]');
    await answer(true);
    check(!names().includes('Brötchen') && !q('#productDlg').open, 'Löschen im Fenster');

    // ---------- Wiederherstellungspunkte ----------
    check((await w().readKeys('punkte')).length === 1, 'Automatischer Wiederherstellungspunkt beim Start angelegt');
    await load(); await wait(300);
    check((await w().readKeys('punkte')).length === 1, 'Nicht öfter als einmal pro Woche');
    click('#menuBtn'); await wait(300);
    check(qa('#snapList .snap').length === 1, 'Punkt erscheint im Sicherungsfenster');
    click('#snapList .snap'); await wait(200);
    check(q('#askTitle').textContent === 'Stand zurückholen?', 'Zurückholen fragt nach');
    await answer(true); await wait(600);
    check(names().includes('Brötchen') && q(`[data-id="${broe}"] img`), 'Gelöschtes Produkt samt Foto ist zurück');
    check((await w().readKeys('punkte')).length === 2, 'Stand vor dem Zurückholen wurde gesichert');

    // ---------- Schichtplan und Bestelltage ----------
    step('Aufgaben');
    await load({ mode: 'tasks', heute: '2026-10-27' });
    const W = w();
    check(W.dayInfo('2026-10-20').label === 'Frühschicht' && W.dayInfo('2026-10-20').time === '05:30–16:00', 'Di 20.10.: Frühschicht 05:30–16:00');
    check(W.dayInfo('2026-10-21').kind === 'school' && W.dayInfo('2026-10-27').label === 'Spätschicht', 'Mi 21.10. Berufsschule, Di 27.10. Spätschicht');
    check(W.dayInfo('2026-11-04').kind === 'work' && W.dayInfo('2026-11-04').ferien === 'Herbstferien', 'Mi 04.11.: Arbeit in den Herbstferien');
    check(W.dayInfo('2026-12-25').kind === 'holiday' && W.dayInfo('2026-10-24').kind === 'weekend', 'Feiertag und Wochenende');
    check(W.lekkerlandDay('2026-10-21') === '2026-10-20', 'Lekkerland, Frühschicht-Woche mit Schul-Mittwoch: Dienstag');
    check(W.lekkerlandDay('2026-10-28') === '2026-10-27', 'Lekkerland, Spätschicht-Woche: Dienstag');
    check(W.lekkerlandDay('2026-11-02') === '2026-11-04', 'Lekkerland, Frühschicht-Woche in den Ferien: Mittwoch');
    check(W.lekkerlandDay('2027-03-08') === '2027-03-10', 'Lekkerland, Frühschicht-Woche nach der Schulzeit: Mittwoch');
    check(W.tabaconDay('2026-10-27') === '2026-10-30' && W.tabaconDay('2027-03-22') === '2027-03-25', 'Tabacon freitags, an Karfreitag donnerstags');

    // ---------- Aufgaben-Ansicht ----------
    check(q('body').dataset.mode === 'tasks' && q('.day-date').textContent.includes('27. Oktober') && q('.today-pill'), 'Start bei den Aufgaben von heute');
    check(q('.day-kind').textContent.includes('Spätschicht') && q('#appTitle').textContent === 'Aufgaben', 'Tageskarte zeigt die Schicht');
    check(q('[data-task="auto-lekkerland"]') && /Produkte in der Liste|noch leer/.test(q('[data-task="auto-lekkerland"] .tmeta').textContent),
      'Lekkerland bestellen steht automatisch mit Stand der Liste');
    check(d().querySelector('meta[name=theme-color]').content === '#0ca678', 'Statusleiste in Aufgaben-Grün');

    click('[data-act=task-add]');
    check(q('#taskDlg').open && q('#tRepeat input[value=once]').checked && q('#tShiftField').hidden, 'Neue Aufgabe: einmalig vorausgewählt');
    q('#tName').value = 'Kasse zählen';
    q('#tRepeat input[value=weekly]').checked = true;
    q('#tRepeat').dispatchEvent(new (w().Event)('change', { bubbles: true }));
    check(!q('#tShiftField').hidden && q('#tRepeat').textContent.includes('Jeden Dienstag'), 'Wöchentlich am Dienstag, Schichtwoche wählbar');
    q('#tShift').value = 'spaet';
    click('#taskDlg [data-tact=save]'); await wait(200);
    const has = (k, title) => w().eval(`tasksFor('${k}')`).some(t => t.title === title);
    check(has('2026-10-27', 'Kasse zählen') && !has('2026-11-03', 'Kasse zählen') && has('2026-11-10', 'Kasse zählen') && !has('2026-10-13', 'Kasse zählen'),
      'Nur dienstags in Spätschicht-Wochen, erst ab heute');

    click('[data-day="2026-10-26"]');
    check(q('.day-date').textContent.includes('26. Oktober') && !q('#todayBtn').hidden, 'Anderen Tag in der Wochenleiste wählen');
    click('[data-act=task-add]');
    q('#tName').value = 'Pfand wegbringen';
    click('#taskDlg [data-tact=save]'); await wait(200);
    click('#todayBtn');
    check(q('main').textContent.includes('Noch offen von früher') && q('main').textContent.includes('Pfand wegbringen'), 'Unerledigtes von gestern steht heute unter "Noch offen"');
    check(q('#badgeTasks').textContent === String(qa('.tlist .trow:not(.done)').length), 'Abzeichen zählt die offenen Aufgaben von heute');
    while (q('.tlist .trow:not(.done) [data-act=task-check]')) q('.tlist .trow:not(.done) [data-act=task-check]').click();
    check(q('canvas.confetti') && !q('.alldone').hidden && q('#badgeTasks').textContent === '', 'Alles erledigt: Konfetti, Abzeichen leer');
    check(q('[data-day="2026-10-27"] .dot').classList.contains('done'), 'Wochenleiste zeigt den Tag als erledigt');
    await load({ mode: 'tasks', heute: '2026-10-27' });
    check(qa('.tlist .trow.done').length === qa('.tlist .trow').length && !q('main').textContent.includes('Pfand'), 'Haken bleiben nach Neustart');

    click('[data-task="auto-lekkerland"] [data-act=task-go]');
    check(q('body').dataset.mode === 'order' && stored().ui.supplier === 'lekkerland' && q('#appTitle').textContent === 'Bestellung',
      'Bestellaufgabe öffnet die Lekkerland-Bestellung');
    check(q('[data-mode-tab=order]').getAttribute('aria-current') === 'page' && q('[data-mode-tab=tasks]').getAttribute('aria-current') === 'false',
      'Unten ist "Bestellung" hervorgehoben');
    check(q('#today').textContent === 'Dienstag, 27. Oktober', 'Titelzeile zeigt das heutige Datum');
    click('[data-mode-tab=tasks]');
    check(q('body').dataset.mode === 'tasks' && q('.week-strip') && getComputedStyle(q('.sup-tabs')).display === 'none', 'Umschalter trennt Aufgaben und Bestellung');

    click('#monthBtn');
    check(q('#monthDlg').open && q('#monthTitle').textContent === 'Oktober 2026' && q('#monthGrid [data-day="2026-10-21"]').classList.contains('kind-school'),
      'Monatsansicht mit Schichtfarben');
    click('#monthGrid [data-day="2026-10-30"]');
    check(!q('#monthDlg').open && q('[data-task="auto-tabacon"]'), 'Tag im Monat antippen springt hin (Freitag: Tabacon)');

    click('[data-day="2026-10-27"]');
    qa('.trow').find(r => r.textContent.includes('Kasse zählen')).querySelector('[data-act=task-open]').click();
    check(q('#tTitle').textContent === 'Aufgabe bearbeiten' && q('#tName').value === 'Kasse zählen', 'Aufgabe zum Bearbeiten öffnen');
    click('#taskDlg [data-tact=delete]');
    check(q('#askText').textContent.includes('an allen Tagen'), 'Löschen warnt bei wiederkehrenden Aufgaben');
    await answer(true);
    check(!has('2026-11-10', 'Kasse zählen'), 'Wiederkehrende Aufgabe gelöscht');

    // ---------- Vorlage aus dem Berichtsheft ----------
    const items = () => stored().tasks.items;
    check(stored().tasks.seed === 2 && items().filter(t => t.repeat === 'pool').length === 12 && items().filter(t => t.id.startsWith('v-')).length === 27,
      'Vorlage eingespielt: 15 feste und 12 „Bei Gelegenheit“');
    check(has('2026-10-27', 'Lotto-Fahrer: Gewinnlose mitgeben, neue Lose, Plakate und Post annehmen') && has('2026-10-26', 'ProGas: Daten der Autogas-Säule übermitteln'),
      'Lotto dienstags (ein Punkt), ProGas montags');
    check(has('2026-11-02', 'Tankautomaten auf Inhalt prüfen') && !has('2026-10-27', 'Tankautomaten auf Inhalt prüfen'), 'Tankautomaten an jedem Frühschicht-Tag');
    const order27 = w().eval(`tasksFor('2026-10-27')`).map(t => t.title);
    check(order27.slice(-2).join('|') === 'Parkposi zahlen|Abrechnung' && order27.indexOf('Lekkerland bestellen') < order27.indexOf('Parkposi zahlen'),
      'Parkposi zahlen und Abrechnung am Ende des Arbeitstags');
    check(!has('2026-10-31', 'Parkposi zahlen') && !has('2026-10-28', 'Abrechnung'), '… aber nicht am Wochenende oder Schultag');

    // Regelmäßig alle 2 Wochen (MHD)
    check(has('2026-10-27', 'Mindesthaltbarkeit (MHD) kontrollieren') && !has('2026-10-31', 'Mindesthaltbarkeit (MHD) kontrollieren'),
      'MHD ist fällig, aber nur an Arbeitstagen');
    qa('.trow').find(r => r.textContent.includes('Mindesthaltbarkeit')) || click('[data-day="2026-10-27"]');
    const mhdRow = () => qa('.trow').find(r => r.textContent.includes('Mindesthaltbarkeit'));
    if (!mhdRow().classList.contains('done')) mhdRow().querySelector('[data-act=task-check]').click();
    check(items().find(t => t.id === 'v-mhd').lastDone === '2026-10-27' && mhdRow().textContent.includes('zuletzt'), 'MHD abgehakt merkt sich das Datum');
    check(!has('2026-11-09', 'Mindesthaltbarkeit (MHD) kontrollieren') && has('2026-11-10', 'Mindesthaltbarkeit (MHD) kontrollieren')
      && !has('2026-11-11', 'Mindesthaltbarkeit (MHD) kontrollieren') && has('2026-11-12', 'Mindesthaltbarkeit (MHD) kontrollieren'),
      'Erst nach 14 Tagen wieder fällig, bleibt dann stehen (Schultag übersprungen)');
    check(!has('2026-10-28', 'Lieferung auspacken, buchen und verräumen') && has('2026-11-04', 'Lieferung auspacken, buchen und verräumen'),
      'Mittwochs-Lieferung nicht an Schultagen, aber in den Ferien');
    check(has('2026-11-02', 'Backwaren aufbacken') && !has('2026-10-27', 'Backwaren aufbacken') && !has('2026-10-31', 'Auslage und Theke säubern'),
      'Aufbacken nur in Frühschicht-Wochen, Putzen nur an Arbeitstagen');
    check(has('2026-12-28', 'Lieferung auspacken, buchen und verräumen') && !has('2027-03-29', 'Lieferung auspacken, buchen und verräumen'),
      'Montags-Lieferung entfällt am Ostermontag');
    const ids = k => w().eval(`tasksFor('${k}')`).map(t => t.id);
    check(ids('2026-10-27').includes('auto-auffuellen') && ids('2026-10-30').includes('auto-auffuellen') && !ids('2026-10-26').includes('auto-auffuellen'),
      'Auffüllen an jedem Bestelltag');
    w().localStorage.setItem('bestellapp', JSON.stringify({ ...stored(), tasks: { ...stored().tasks, seed: 0 } }));
    await load({ mode: 'tasks', heute: '2026-10-27' });
    check(items().filter(t => t.id.startsWith('v-')).length === 27, 'Vorlage wird nicht doppelt eingespielt');

    // Umstellung einer Vorlage von Version 1 (so wie sie auf dem Handy liegt)
    const v1 = stored();
    v1.tasks.seed = 1;
    v1.tasks.items = v1.tasks.items.filter(t => !['v-spuelmaschine', 'v-parkposi', 'v-abrechnung', 'v-gasflaschen', 'v-zeitungen'].includes(t.id));
    Object.assign(v1.tasks.items.find(t => t.id === 'v-tankautomat'), { repeat: 'pool', shift: 'any' });
    Object.assign(v1.tasks.items.find(t => t.id === 'v-mhd'), { repeat: 'workdays', every: null, lastDone: null });
    v1.tasks.items.push({ id: 'v-wischen', title: 'Kühlschränke und Schränke auswischen', repeat: 'workdays', shift: 'any' },
      { id: 'v-lotto-annahme', title: 'Lotto-Lieferung: neue Lose einbuchen', repeat: 'weekly', weekday: 2, shift: 'work' });
    w().localStorage.setItem('bestellapp', JSON.stringify(v1));
    await load({ mode: 'tasks', heute: '2026-10-27' });
    const after = items();
    check(!after.some(t => ['v-wischen', 'v-lotto-annahme'].includes(t.id)), 'Umstellung: Auswischen und zweiter Lotto-Punkt entfernt');
    check(after.find(t => t.id === 'v-tankautomat').repeat === 'workdays' && after.find(t => t.id === 'v-mhd').repeat === 'interval'
      && after.find(t => t.id === 'v-mhd').every === 14, 'Umstellung: Tankautomat Frühschicht, MHD alle 2 Wochen');
    check(['v-spuelmaschine', 'v-parkposi', 'v-abrechnung', 'v-gasflaschen'].every(id => after.some(t => t.id === id)), 'Umstellung: neue Aufgaben ergänzt');
    check(!after.some(t => t.id === 'v-zeitungen'), 'Umstellung: selbst gelöschte Aufgaben kommen nicht zurück');

    click('[data-act=task-add]');
    q('#tRepeat input[value=interval]').checked = true;
    q('#tRepeat').dispatchEvent(new (w().Event)('change', { bubbles: true }));
    check(!q('#tEveryField').hidden && q('#tShiftField').hidden && q('#tEvery').value === '14', 'Neue Aufgabe „Regelmäßig“: alle 2 Wochen vorausgewählt');
    click('#taskDlg [data-tact=cancel]');

    // ---------- Bei Gelegenheit ----------
    check(q('details.pool') && !q('details.pool').open, 'Dienstag: „Bei Gelegenheit“ ist zugeklappt');
    click('[data-day="2026-10-31"]');
    check(!q('details.pool'), 'Wochenende: kein „Bei Gelegenheit“');
    click('[data-day="2026-10-29"]');
    check(q('details.pool').open && qa('details.pool .trow').length === 12, 'Donnerstag: aufgeklappt mit 12 Aufgaben');
    const first = q('details.pool .trow');
    const poolTitle = first.querySelector('.ttitle').textContent.trim();
    first.querySelector('[data-act=task-check]').click();
    check(items().find(t => t.title === poolTitle).lastDone === '2026-10-29', 'Erledigt merkt sich das Datum');
    const rows = qa('details.pool .trow');
    check(rows[rows.length - 1].querySelector('.ttitle').textContent.trim() === poolTitle && rows[rows.length - 1].classList.contains('done'),
      'Zuletzt erledigte rutscht nach unten');
    check(q('details.pool').open && !q('canvas.confetti'), 'Bereich bleibt offen, kein Konfetti für Gelegenheits-Aufgaben');
    rows[rows.length - 1].querySelector('[data-act=task-check]').click();
    check(items().find(t => t.title === poolTitle).lastDone === null, 'Haken weg: Datum wieder wie vorher');
    click('[data-act=task-add]');
    q('#tRepeat input[value=pool]').checked = true;
    q('#tRepeat').dispatchEvent(new (w().Event)('change', { bubbles: true }));
    check(q('#tShiftField').hidden, 'Neue Aufgabe „Bei Gelegenheit“ ohne Tageswahl');
    click('#taskDlg [data-tact=cancel]');

    // ---------- Offline-Speicher ----------
    const cacheName = (await w().caches.keys()).find(k => k.startsWith('bestellapp'));
    const cachedApp = cacheName && await (await (await w().caches.open(cacheName)).match('app.js')).text();
    check(cachedApp && cachedApp.includes(`VERSION = '${w().eval('VERSION')}'`), `Offline-Speicher ${cacheName} enthält die aktuelle Version`);
  } catch (e) {
    check(false, 'Abbruch: ' + e.stack);
  }
  const result = (fails ? fails + ' FEHLER' : 'ALLES OK') + '\n' + log.join('\n');
  document.getElementById('log').textContent = result;
  document.title = 'fertig';
  fetch('/__result', { method: 'POST', body: result }).catch(() => {});
})();
</script>
</body>
</html>
